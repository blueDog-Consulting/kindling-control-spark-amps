      <rect x="232" y="510" width="560" height="380" rx="44" fill="url(#tolex)" stroke="#000" stroke-width="6"/>
      <rect x="262" y="538" width="500" height="78" rx="12" fill="url(#panel)"/>
      <circle cx="318" cy="577" r="22" fill="#1b1b1b"/><line x1="318" y1="577" x2="328" y2="561" stroke="#f5f1e6" stroke-width="5" stroke-linecap="round"/><circle cx="400" cy="577" r="22" fill="#1b1b1b"/><line x1="400" y1="577" x2="410" y2="561" stroke="#f5f1e6" stroke-width="5" stroke-linecap="round"/><circle cx="482" cy="577" r="22" fill="#1b1b1b"/><line x1="482" y1="577" x2="492" y2="561" stroke="#f5f1e6" stroke-width="5" stroke-linecap="round"/><circle cx="564" cy="577" r="22" fill="#1b1b1b"/><line x1="564" y1="577" x2="574" y2="561" stroke="#f5f1e6" stroke-width="5" stroke-linecap="round"/><circle cx="646" cy="577" r="22" fill="#1b1b1b"/><line x1="646" y1="577" x2="656" y2="561" stroke="#f5f1e6" stroke-width="5" stroke-linecap="round"/>
