    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2"/><stop offset="1" stop-color="#b8ad94"/>
    </linearGradient>
    <pattern id="grille" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#5a2a22"/><rect width="11" height="22" fill="#6e3429"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8754a"/><stop offset="1" stop-color="#5a3820"/>
