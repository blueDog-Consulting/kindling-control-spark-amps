        <g transform="rotate(14)"><rect x="-170" y="-24" width="340" height="48" rx="24" fill="url(#wood)"/><ellipse cx="-146" cy="0" rx="16" ry="20" fill="#d9ab78"/><ellipse cx="146" cy="0" rx="16" ry="20" fill="#d9ab78"/></g>
      </g>
