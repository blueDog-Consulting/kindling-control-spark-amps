name: Release

# Push a version tag to release:   git tag v0.2.0 && git push origin v0.2.0
# Only apps whose code changed since the previous v* tag are rebuilt
# (tools/release-plan.js). Pre-release tags (v0.2.0-beta.1) become GitHub
# pre-releases. The website (kindlingspark.app) lives in its own repo,
# bluedog-consulting/kindling-control-website.
# See docs/RELEASING.md for secrets and details.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true
      force:
        description: Build every app, even if unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
      android_reason: ${{ steps.plan.outputs.android_reason }}
      desktop_reason: ${{ steps.plan.outputs.desktop_reason }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history + tags, to diff against the previous release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Decide what to build
        id: plan
        env:
          FORCE_ALL: ${{ github.event.inputs.force || 'false' }}
        run: node tools/release-plan.js "$TAG"
      - name: Check store release notes
        # A final Android build needs release-notes/<version>/android.txt (see release-notes/README.md).
        # Fail here, before anything is built. Notes that exist are always validated (length limits).
        env:
          ANDROID_BUILT: ${{ steps.plan.outputs.android }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          require=()
          if [ "$ANDROID_BUILT" = "true" ] && [ "$PRERELEASE" != "true" ]; then require=(--require android); fi
          node tools/release-notes.js "$TAG" "${require[@]}"

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy web app into the Android project
        run: npx cap sync android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: |
          mkdir -p ../out
          props=(-PversionName="$VERSION" -PversionCode="$VERSION_CODE")
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease "${props[@]}"
            cp app/build/outputs/apk/release/app-release.apk "../out/kindling-control-${VERSION}-android.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../out/kindling-control-${VERSION}-android.aab"
          else
            echo "::warning::No Android signing secrets; publishing a debug-signed APK (installable by sideloading, not for Google Play)."
            ./gradlew --no-daemon assembleDebug "${props[@]}"
            cp app/build/outputs/apk/debug/app-debug.apk "../out/kindling-control-${VERSION}-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          # macOS is left out until its build works; build it locally (docs/APPS.md)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # unsigned builds until signing certificates are configured (docs/RELEASING.md)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set app version from tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [plan, android, desktop]
    # run when planning succeeded and no build failed (skipped builds are fine)
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      # passed through env, never interpolated into scripts (reasons contain file names)
      ANDROID_BUILT: ${{ needs.plan.outputs.android }}
      ANDROID_REASON: ${{ needs.plan.outputs.android_reason }}
      DESKTOP_BUILT: ${{ needs.plan.outputs.desktop }}
      DESKTOP_REASON: ${{ needs.plan.outputs.desktop_reason }}
    steps:
      - uses: actions/checkout@v7 # for release-notes/<version>/
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        continue-on-error: true # nothing to download when no app changed
        with:
          path: assets
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          row() { if [ "$2" = "true" ]; then echo "| $1 | ✅ built | $3 |"; else echo "| $1 | – skipped | $3 |"; fi; }
          {
            echo "## Builds"
            echo
            echo "| App | | Why |"
            echo "|---|---|---|"
            row "Android" "$ANDROID_BUILT" "$ANDROID_REASON"
            row "Desktop (Windows, Linux)" "$DESKTOP_BUILT" "$DESKTOP_REASON"
            echo
            echo "Skipped apps are unchanged since ${PREVIOUS:-the previous release}; use the downloads from that release."
            echo "There is no macOS build yet; build it from source (docs/APPS.md)."
            echo "Desktop builds are not code-signed yet: on Windows choose \"More info → Run anyway\"."
            echo
          } > notes.md
          # Versioned store notes: shown in the release body and attached as <app>-whatsnew.txt files,
          # ready to paste into Google Play Console / App Store Connect.
          node tools/release-notes.js "$TAG" --out assets --markdown notes.md
          args=(-f tag_name="$TAG")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body >> notes.md || true
          cat notes.md
      - name: Publish GitHub release
        run: |
          shopt -s nullglob
          files=(assets/*)
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" "${files[@]}"
          fi
