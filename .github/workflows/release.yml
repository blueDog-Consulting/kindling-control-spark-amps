name: Release

# Push a version tag to release:   git tag v0.2.0 && git push origin v0.2.0
# Only apps whose code changed since the previous v* tag are rebuilt
# (tools/release-plan.js). Pre-release tags (v0.2.0-beta.1) become GitHub
# pre-releases. The website (kindlingcontrol.app) lives in its own repo,
# bluedog-consulting/kindling-control-website.
# See docs/RELEASING.md for secrets and details.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true
      force:
        description: Build every app, even if unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
      android_reason: ${{ steps.plan.outputs.android_reason }}
      desktop_reason: ${{ steps.plan.outputs.desktop_reason }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      previous: ${{ steps.plan.outputs.previous }}
      notes_stores: ${{ steps.notes.outputs.stores }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history + tags, to diff against the previous release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Decide what to build
        id: plan
        env:
          FORCE_ALL: ${{ github.event.inputs.force || 'false' }}
        run: node tools/release-plan.js "$TAG"
      - name: Check store release notes
        # Store notes belong to the apps this release builds; the release job publishes exactly this set
        # (outputs.stores). Today that's Android when it's built: macOS isn't built in CI, so its notes are
        # neither checked nor attached here (add "macos" with the desktop build once macOS is in the matrix).
        # A final Android build needs release-notes/<version>/android.txt; fail here, before anything is built.
        id: notes
        env:
          ANDROID_BUILT: ${{ steps.plan.outputs.android }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          stores=''
          require=()
          if [ "$ANDROID_BUILT" = "true" ]; then
            stores=android
            if [ "$PRERELEASE" != "true" ]; then require=(--require android); fi
          fi
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          if [ -z "$stores" ]; then echo "This release builds no store app: no store notes to check."; exit 0; fi
          node tools/release-notes.js "$TAG" --only "$stores" "${require[@]}"

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4 # release-android.sh installs the SDK platform it needs (CI only)
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        # The same script maintainers run locally (npm run release:android): cap sync, Gradle, and for a
        # signed build the checks that the .aab is signed by the keystore's key. The release job writes the
        # Play notes, so --no-notes.
        run: |
          flags=(--skip-install --no-notes)
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "::warning::No Android signing secrets; publishing a debug-signed APK (installable by sideloading, not for Google Play)."
            flags+=(--debug)
          fi
          bash tools/release-android.sh "$TAG" "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          # macOS is left out until its build works; build it locally (docs/APPS.md)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # unsigned builds until signing certificates are configured (docs/RELEASING.md)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set app version from tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Stamp the app version (used in anonymous error reports)
        run: node tools/stamp-version.js "$VERSION"
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [plan, android, desktop]
    # run when planning succeeded and no build failed (skipped builds are fine)
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      # passed through env, never interpolated into scripts (reasons contain file names)
      ANDROID_BUILT: ${{ needs.plan.outputs.android }}
      ANDROID_REASON: ${{ needs.plan.outputs.android_reason }}
      DESKTOP_BUILT: ${{ needs.plan.outputs.desktop }}
      DESKTOP_REASON: ${{ needs.plan.outputs.desktop_reason }}
      NOTES_STORES: ${{ needs.plan.outputs.notes_stores }}
    steps:
      - uses: actions/checkout@v7 # for release-notes/<version>/
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        continue-on-error: true # nothing to download when no app changed
        with:
          path: assets
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          row() { if [ "$2" = "true" ]; then echo "| $1 | ✅ built | $3 |"; else echo "| $1 | – skipped | $3 |"; fi; }
          {
            echo "## Builds"
            echo
            echo "| App | | Why |"
            echo "|---|---|---|"
            row "Android" "$ANDROID_BUILT" "$ANDROID_REASON"
            row "Desktop (Windows, Linux)" "$DESKTOP_BUILT" "$DESKTOP_REASON"
            echo
            echo "Skipped apps are unchanged since ${PREVIOUS:-the previous release}; use the downloads from that release."
            echo "There is no macOS build yet; build it from source (docs/APPS.md)."
            echo "Desktop builds are not code-signed yet: on Windows choose \"More info → Run anyway\"."
            echo
          } > notes.md
          # Versioned store notes, for the store apps this release built (the plan job checked the same set):
          # shown in the release body and attached as <app>-whatsnew.txt, ready to paste into Play Console.
          if [ -n "$NOTES_STORES" ]; then
            node tools/release-notes.js "$TAG" --only "$NOTES_STORES" --out assets --markdown notes.md
          fi
          args=(-f tag_name="$TAG")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body >> notes.md || true
          cat notes.md
      - name: Publish GitHub release
        run: |
          shopt -s nullglob
          files=(assets/*)
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" "${files[@]}"
          fi
