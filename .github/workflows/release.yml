name: Release

# Two ways to release:
#   - push a version tag:   git tag v0.2.0 && git push origin v0.2.0   (or npm run release -- v0.2.0)
#   - from the web or a phone: Actions -> Release -> Run workflow, on main, with a new tag such as v0.3.0.
#     The run tests main, creates the tag on main's commit and releases it. Running it with an existing tag
#     rebuilds that release.
# Only apps whose code changed since the previous v* tag are rebuilt (tools/release-plan.js). Pre-release tags
# (v0.2.0-beta.1) become GitHub pre-releases. Store notes come from release-notes/<version>/ when committed,
# else from the "notes" input, else they are generated from the changes since the previous tag.
# The website (kindlingcontrol.app) lives in its own repo, bluedog-consulting/kindling-control-website.
# See docs/RELEASING.md for secrets and details.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.3.0. A new tag is created on main (run from main); an existing one is rebuilt.
        required: true
      notes:
        description: Google Play "What's new" (optional, 500 characters, \n for a new line). Empty = committed file, or generated from the changes.
        required: false
        default: ''
      force:
        description: Build every app, even if unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to push a new tag from a manual run on main
    outputs:
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
      ios: ${{ steps.plan.outputs.ios }}
      android_reason: ${{ steps.plan.outputs.android_reason }}
      desktop_reason: ${{ steps.plan.outputs.desktop_reason }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      previous: ${{ steps.plan.outputs.previous }}
      notes_stores: ${{ steps.notes.outputs.stores }}
      notes_source: ${{ steps.notes.outputs.source }}
      android_notes: ${{ steps.notes.outputs.android_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, to diff against the previous release
      - name: Check out the tag, or prepare to create it
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "Releasing the existing tag $TAG ($(git rev-parse --short HEAD))."
            exit 0
          fi
          if [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Tag $TAG doesn't exist. A manual run creates a new tag only when it runs on main."
            exit 1
          fi
          case "$TAG" in v*) ;; *) echo "::error::Tags start with v, like v0.3.0."; exit 1 ;; esac
          # Fails on anything that isn't vMAJOR.MINOR.PATCH[-pre]: the same rule as the rest of the pipeline.
          node --input-type=module -e "import { versionFromTag } from './tools/release-plan.js'; versionFromTag(process.argv[1]);" "$TAG"
          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "Will create $TAG on main ($(git rev-parse --short HEAD)) once the tests pass."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Create the tag
        # Pushed with the workflow's own token, which doesn't start another run of this workflow, so this run
        # carries on with the release. The later jobs check out the tag.
        if: steps.tag.outputs.create == 'true'
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG on $(git rev-parse --short HEAD)."
      - name: Decide what to build
        id: plan
        env:
          FORCE_ALL: ${{ github.event.inputs.force || 'false' }}
        run: node tools/release-plan.js "$TAG"
      - name: Store release notes
        # Store notes belong to the apps this release builds; the release job publishes exactly this set
        # (outputs.stores). Today that's Android when it's built: macOS isn't built in CI, so its notes are
        # neither checked nor attached here (add "macos" with the desktop build once macOS is in the matrix).
        # A final Android release needs Play notes. A committed release-notes/<version>/android.txt wins;
        # without one, the "notes" input is used, and without that they're generated from the pull requests
        # and commits since the previous tag that changed the Android app (tools/release-notes.js --fill).
        # Notes typed into the input that are too long fail here, before anything is built.
        id: notes
        env:
          ANDROID_BUILT: ${{ steps.plan.outputs.android }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_NOTES_TEXT: ${{ github.event.inputs.notes }}
        run: |
          stores=''
          flags=()
          if [ "$ANDROID_BUILT" = "true" ]; then
            stores=android
            if [ "$PRERELEASE" != "true" ]; then
              flags=(--require android --fill android)
              if [ -n "$PREVIOUS" ]; then flags+=(--since "$PREVIOUS"); fi
            fi
          fi
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          if [ -z "$stores" ]; then echo "This release builds no store app: no store notes to check."; exit 0; fi
          node tools/release-notes.js "$TAG" --only "$stores" "${flags[@]}" | tee notes-check.txt
          source=$(sed -n 's/^android: source=//p' notes-check.txt)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          file="release-notes/$VERSION/android.txt"
          # Notes that weren't committed exist only in this job's checkout: hand them to the release job.
          if [ -n "$source" ] && [ "$source" != "committed" ]; then
            delim="EOF_$(openssl rand -hex 16)"
            { echo "android_notes<<$delim"; cat "$file"; echo "$delim"; } >> "$GITHUB_OUTPUT"
            {
              echo "### Google Play notes ($source)"
              echo
              echo '```text'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4 # release-android.sh installs the SDK platform it needs (CI only)
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        # The same script maintainers run locally (npm run release:android): cap sync, Gradle, and for a
        # signed build the checks that the .aab is signed by the keystore's key. The release job writes the
        # Play notes, so --no-notes.
        run: |
          flags=(--skip-install --no-notes)
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "::warning::No Android signing secrets; publishing a debug-signed APK (installable by sideloading, not for Google Play)."
            flags+=(--debug)
          fi
          bash tools/release-android.sh "$TAG" "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          # macOS is left out until its build works; build it locally (docs/APPS.md)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # unsigned builds until signing certificates are configured (docs/RELEASING.md)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set app version from tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Stamp the app version (used in anonymous error reports)
        run: node tools/stamp-version.js "$VERSION"
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  # iOS: an unsigned iOS Simulator build that proves the app compiles from the tag. Nothing is published, and
  # the release job doesn't wait for it, so a failed iOS build can't block the Android and desktop release
  # (that's why macOS desktop left the matrix). Signed TestFlight builds are #34. Same script as locally.
  # Off until iOS builds start: needs the repo variable IOS_BUILDS_ENABLED = 'true' (docs/RELEASING.md).
  ios:
    needs: plan
    if: vars.IOS_BUILDS_ENABLED == 'true' && needs.plan.outputs.ios == 'true'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for the iOS Simulator (unsigned)
        run: bash tools/release-ios.sh "$TAG" --skip-install
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app # kept on the run, not attached to the release
          path: out/*-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [plan, android, desktop]
    # run when planning succeeded and no build failed (skipped builds are fine)
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      # passed through env, never interpolated into scripts (reasons contain file names)
      ANDROID_BUILT: ${{ needs.plan.outputs.android }}
      ANDROID_REASON: ${{ needs.plan.outputs.android_reason }}
      DESKTOP_BUILT: ${{ needs.plan.outputs.desktop }}
      DESKTOP_REASON: ${{ needs.plan.outputs.desktop_reason }}
      NOTES_STORES: ${{ needs.plan.outputs.notes_stores }}
      NOTES_SOURCE: ${{ needs.plan.outputs.notes_source }}
      ANDROID_NOTES: ${{ needs.plan.outputs.android_notes }}
    steps:
      - uses: actions/checkout@v7 # for release-notes/<version>/
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        continue-on-error: true # nothing to download when no app changed
        with:
          path: release-files # not "assets": the checkout already has an assets/ folder (logo sources)
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          row() { if [ "$2" = "true" ]; then echo "| $1 | ✅ built | $3 |"; else echo "| $1 | – skipped | $3 |"; fi; }
          {
            echo "## Builds"
            echo
            echo "| App | | Why |"
            echo "|---|---|---|"
            row "Android" "$ANDROID_BUILT" "$ANDROID_REASON"
            row "Desktop (Windows, Linux)" "$DESKTOP_BUILT" "$DESKTOP_REASON"
            echo
            echo "Skipped apps are unchanged since ${PREVIOUS:-the previous release}; use the downloads from that release."
            echo "There is no macOS build yet; build it from source (docs/APPS.md). The iPhone and iPad app isn't released yet."
            echo "Desktop builds are not code-signed yet: on Windows choose \"More info → Run anyway\"."
            echo
          } > notes.md
          # Versioned store notes, for the store apps this release built (the plan job checked the same set):
          # shown in the release body and attached as <app>-whatsnew.txt, ready to paste into Play Console.
          # Notes that weren't committed (typed into the run, or generated) come from the plan job.
          if [ -n "$ANDROID_NOTES" ] && [ ! -f "release-notes/$VERSION/android.txt" ]; then
            mkdir -p "release-notes/$VERSION"
            printf '%s\n' "$ANDROID_NOTES" > "release-notes/$VERSION/android.txt"
          fi
          if [ -n "$NOTES_STORES" ]; then
            node tools/release-notes.js "$TAG" --only "$NOTES_STORES" --out release-files --markdown notes.md
            case "$NOTES_SOURCE" in
              generated) echo "_The Google Play notes were generated from the changes since ${PREVIOUS:-the first commit}. Edit them in Play Console if they need it._" >> notes.md; echo >> notes.md ;;
              input) echo "_The Google Play notes were typed in when this release was started._" >> notes.md; echo >> notes.md ;;
            esac
          fi
          args=(-f tag_name="$TAG")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body >> notes.md || true
          cat notes.md
      - name: Publish GitHub release
        run: |
          shopt -s nullglob
          files=(release-files/*)
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" "${files[@]}"
          fi
