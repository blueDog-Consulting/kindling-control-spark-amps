name: Feature request
description: Suggest something KindlingControl should do.
type: Feature
# No labels here on purpose: workflow labels are applied by maintainers only.
# The "App" answer becomes platform:* labels (tools/issue-platforms.js).
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the goal, in your own words. What are you trying to do with your amp?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Your idea for how it could look or behave.
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which apps should have it? Most features come to all of them.
      multiple: true
      options:
        - Desktop app (Windows/macOS/Linux)
        - Android app
        - iPhone or iPad app
        - Browser (development build)
        - Not sure
  - type: dropdown
    id: amp
    attributes:
      label: Amp model
      description: Optional. Is this about a particular amp?
      multiple: true
      options:
        - Spark 40
        - Spark MINI
        - Spark GO
        - Spark 2
        - Spark NEO
        - All of them
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Optional. Workarounds you use today, links, screenshots.
